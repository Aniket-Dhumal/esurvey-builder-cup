[project]
name = "esurvey-ai"
version = "0.1.0"
description = "Gemini assessment agent for post-disaster crop loss evaluation"
requires-python = ">=3.11"

dependencies = [
    "google-adk>=1.15,<3",
    "google-genai>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "aiortc>=1.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    # The real PostgreSQL grammar, via libpg_query. Used to parse the Go
    # service's migrations without a database -- a test tool, so it stays out
    # of the runtime image.
    "pglast>=8.4",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esurvey_ai"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
