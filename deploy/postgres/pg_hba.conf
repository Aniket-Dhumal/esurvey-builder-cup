# Client authentication for the primary.
#
# The image's own defaults, plus one line: streaming replication from the
# compose network, so the read replica can follow this server. Everything from
# outside the container authenticates with SCRAM; the socket and loopback are
# trusted as the image trusts them, for the healthcheck and docker exec.
#
# TYPE  DATABASE     USER  ADDRESS       METHOD
local   all          all                 trust
host    all          all   127.0.0.1/32  trust
host    all          all   ::1/128       trust
local   replication  all                 trust
host    replication  all   127.0.0.1/32  trust
host    replication  all   ::1/128       trust
host    replication  all   all           scram-sha-256
host    all          all   all           scram-sha-256
