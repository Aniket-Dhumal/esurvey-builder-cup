[project]
name = "esurvey-sar"
version = "0.1.0"
description = "Sentinel-1 backscatter for post-disaster crop loss assessment"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # The Earth Engine client. Optional at runtime: synthetic mode and the
    # whole HTTP contract work without it, which is what lets the platform
    # side be developed before a project is registered.
    "earthengine-api>=1.4",
    # Shared task state, so the service can run as more than one replica.
    # Optional at runtime: with no ESURVEY_SAR_REDIS_URL the state stays in
    # this process and this import never happens.
    "redis>=5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esurvey_sar"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
