name: esurvey
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.16.0+27

environment:
  sdk: ^3.10.9

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.4+2
  path: ^1.9.1
  path_provider: ^2.1.6
  flutter_secure_storage: ^11.0.0
  geolocator: ^14.0.3
  camera: ^0.12.0+2
  flutter_tts: ^4.2.5
  http: ^1.6.0
  connectivity_plus: ^7.3.1
  crypto: ^3.0.7
  sensors_plus: 6.1.1
  workmanager: ^0.10.9
  # Reminding a farmer that a claim is still on the phone. The phone
  # reminds itself: nothing leaves the handset and nothing needs a
  # network, which is the only kind of reminder this app can promise.
  flutter_local_notifications: ^19.4.2
  webview_flutter: ^4.14.1
  flutter_foreground_task: ^10.0.0
  record: 6.0.0
  flutter_pcm_sound: ^3.3.3
  web_socket_channel: ^3.0.3
  flutter_webrtc: ^1.6.2+hotfix.3
  # Encoding one small JPEG for the assistant to look at.
  #
  # The relay accepts image/jpeg and nothing else, capped at 80 KB, and Flutter
  # itself can only encode PNG -- a PNG of a photograph is several times the size
  # and would take most of a minute to leave a farm on a quarter-megabit link.
  #
  # The slow half of this package is not used: the still is scaled down by the
  # platform's own decoder, which is native, and only the small result is handed
  # here to be encoded. See live/live_frame.dart.
  image: ^4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.0+3

  # Declared rather than leaned on through flutter_test, which is where it
  # arrives from. The voice queue caps how long one line may hold the engine, and
  # proving that cap needs time to pass without a test that waits twelve seconds
  # for it.
  fake_async: ^1.3.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/brand/

  # Poppins, bundled rather than fetched.
  #
  # It draws Latin and Devanagari as one design -- it was made for that pairing
  # by an Indian foundry -- so a bilingual screen has a single voice instead of
  # a Latin face plus whatever the handset falls back to for Marathi. Verified
  # to cover 94 codepoints of the Devanagari block, with nothing missing from
  # the strings this app actually shows.
  #
  # Bundled and not google_fonts, because that package downloads a typeface at
  # first use. This app is opened in fields with no signal, by farmers on
  # metered connections, and a login screen that renders in a fallback face
  # until it can reach a CDN is exactly the wrong first impression -- for a
  # cost of about 630 kB in the APK, once.
  #
  # Four weights and no italics: nothing in this interface is italic, and every
  # unused weight is 155 kB a farmer downloads for nothing.
  # Noto Sans, the same pair the officers' console renders.
  #
  # Poppins was here first, and it did carry Devanagari -- it is by an Indian
  # foundry -- so Marathi was never broken. It is a geometric display face
  # though, drawn to be looked at, and a form somebody fills in standing in a
  # wet field wants the opposite. Noto is the face most Indian government
  # systems already use for Devanagari, so a farmer's report now looks the same
  # on the handset that captured it as on the console that decides it.
  #
  # Two families rather than one, because Noto Sans does not cover Devanagari
  # and Noto Sans Devanagari does not cover Latin. ui/theme.dart names the
  # first and falls back to the second, so a bilingual line takes each script
  # from the face that drew it.
  #
  # Both are variable fonts subsetted to what this app actually renders:
  # 2.7 MB of full Noto down to 748 KB, against Poppins' 628 KB. A hundred
  # kilobytes is a fair price on a phone in Barshi; two megabytes was not.
  fonts:
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/NotoSans.ttf
    - family: Noto Sans Devanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari.ttf

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
