[project]
name = "esurvey-vision"
version = "0.1.0"
description = "Ground computer vision for post-disaster crop loss assessment"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
    # Headless: this decodes video in a container with no display, and the
    # GUI build drags in an X stack that would never be used.
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esurvey_vision"]
